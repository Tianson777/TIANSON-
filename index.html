<!DOCTYPE html>
<html>
<head>
    <title>Game Character</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Game Character</h1>

    <label>Enter hero name:</label>
    <input type="text" id="name">

    <label>Enter hero role:</label>
    <input type="text" id="role">

    <label>Enter hero level:</label>
    <input type="number" id="level">

    <label>Enter hero HP:</label>
    <input type="number" id="hp">

    <label>Enter hero Mana:</label>
    <input type="number" id="mana">

    <button onclick="displayInformation()">
        Display Information
    </button>

    <button onclick="useSkill()">
        Use Skill
    </button>

    <div id="output"></div>

</div>

<script>

function displayInformation() {

    let name = document.getElementById("name").value;
    let role = document.getElementById("role").value;
    let level = document.getElementById("level").value;
    let hp = document.getElementById("hp").value;
    let mana = document.getElementById("mana").value;

    document.getElementById("output").innerHTML =
        "<h2>--- Game Character Information ---</h2>" +
        "<p>Name: " + name + "</p>" +
        "<p>Role: " + role + "</p>" +
        "<p>Level: " + level + "</p>" +
        "<p>HP: " + hp + "</p>" +
        "<p>Mana: " + mana + "</p>";
}

function useSkill() {

    let name = document.getElementById("name").value;

    document.getElementById("output").innerHTML =
        "<p>" + name + " uses a special skill!</p>" +
        "<p>" + name +
        " attacks the enemy using their ability.</p>";
}

</script>

</body>
</html>
